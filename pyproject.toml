[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whycode"
version = "0.1.0"
description = "Evidence-backed codebase history investigation"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
